<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
    <h2 class="text-sm font-extrabold uppercase tracking-wider text-amber-400">1. Level Information</h2>
    <div class="space-y-3">
        <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Lesson Title</label>
            <input type="text" id="lvl-title" placeholder="e.g. 1-2-2 Forecheck Pressure" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        </div>
        <div>
            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Active Map Board Target</label>
            <div class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                assets/bg.png (Loaded)
            </div>
        </div>
    </div>

    <h2 class="text-sm font-extrabold uppercase tracking-wider text-blue-400 pt-2">2. Toolset Element Library</h2>
    <p class="text-[10px] text-slate-400 leading-relaxed">Click a button below to generate a customizable object token directly in the active center of your design grid view canvas:</p>
    <div id="toolbox" class="grid grid-cols-2 gap-2">
        <button onclick="spawnElement('F1')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">F1</button>
        <button onclick="spawnElement('F2')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">F2</button>
        <button onclick="spawnElement('F3')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">F3</button>
        <button onclick="spawnElement('D1')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">D1</button>
        <button onclick="spawnElement('D2')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">D2</button>
        <button onclick="spawnElement('D3')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">D3</button>
        <button onclick="spawnElement('puck')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">Puck</button>
        <button onclick="spawnElement('net')" class="bg-slate-950 hover:bg-slate-800 border border-slate-800 py-2 rounded-xl text-xs font-bold font-mono">Net</button>
        <button onclick="spawnElement('correct')" class="bg-emerald-950/40 text-emerald-400 border border-emerald-900/40 py-2 rounded-xl text-xs font-black font-mono">CORRECT ZONE</button>
    </div>

    <div class="border-t border-slate-800/80 my-2 pt-4">
        <button onclick="publishConstructedLevel()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-xs py-3 rounded-xl tracking-wider uppercase shadow-lg text-white">Deploy Play To App</button>
    </div>
</div>
