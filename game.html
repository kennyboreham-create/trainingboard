<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hockey Board Challenge</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b1329; touch-action: none; }
        canvas { 
            background-size: 100% 100%; 
            background-position: center; 
            background-repeat: no-repeat;
            touch-action: none; 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-victory {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col items-center p-4 select-none">

    <div class="max-w-4xl w-full flex justify-between items-center mb-2 shrink-0">
        <div>
            <h1 class="text-xl font-black uppercase text-white tracking-tight">Hockey Challenge Arena</h1>
            <div id="level-title-display" class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-0.5">Scenario Dashboard</div>
            <!-- Hidden fallback loop element if single-level route context is active -->
            <select id="level-selector" onchange="loadSelectedLevelByIndex()" class="hidden bg-slate-900 border border-slate-800 text-xs px-3 py-1.5 rounded-xl font-bold mt-1 text-slate-300 outline-none cursor-pointer"></select>
        </div>
        <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center flex flex-col items-end gap-0.5">
            <span id="game-status-text" class="text-xs font-bold uppercase tracking-wider text-slate-400">Loading Tactics...</span>
            <span id="star-status-text" class="text-[10px] font-bold uppercase tracking-widest text-amber-400 hidden">⭐ Star Available</span>
        </div>
    </div>

    <div class="relative w-full max-w-4xl bg-slate-950 rounded-2xl border-2 border-slate-800 shadow-2xl overflow-hidden aspect-[1000/600]">
        <canvas id="gameCanvas" width="1000" height="600" class="w-full h-full"></canvas>
    </div>

    <div id="victory-container"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwSuMSji4cLPqHii0UhYSqAr5d-cYGI7PDWI55RiCa9wP-F3tJ9nNONjzzAtnT2Ph2K/exec";
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let levels = [];
        let activeLevelIndex = 0;
        let activeLevel = null;
        let elements = [];
        let activeDragElement = null;
        let isLevelCleared = false;

        // Dynamic lesson integration parameters extracted from URL query strings
        let urlParams = new URLSearchParams(window.location.search);
        let targetLevelId = urlParams.get('levelId') || urlParams.get('id'); 
        let activePlayerId = urlParams.get('playerId') || '';
        let isAlreadyCompleted = false;

        const sfxMusic = new Audio('assets/music.mp3'); sfxMusic.loop = true; sfxMusic.volume = 0.20;
        const sfxScore = new Audio('assets/scores.mp3');

        window.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', () => { 
                sfxMusic.play().catch(() => {}); 
            }, { once: true });
            initGameEngine();
        });

        async function initGameEngine() {
            try {
                // 1. First fetch global dashboard data context to verify player completion progress logs
                let completedIds = [];
                if (activePlayerId) {
                    const progressRes = await fetch(`${API_URL}?action=getDashboard&playerId=${activePlayerId}`);
                    const progressData = await progressRes.json();
                    if (progressData.success && progressData.completedRawIds) {
                        completedIds = progressData.completedRawIds;
                    }
                }

                // 2. Pull training scenarios out of game board arrays
                const response = await fetch(`${API_URL}?action=getLevels`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                const res = await response.json();
                
                if (res.success && res.levels && res.levels.length > 0) {
                    levels = res.levels;
                    
                    // Match scenario based on incoming URL lesson tags, default to first item if unassigned
                    let matchingIndex = 0;
                    if (targetLevelId) {
                        matchingIndex = levels.findIndex(l => l.id.toString().trim() === targetLevelId.toString().trim());
                        if (matchingIndex === -1) matchingIndex = 0;
                    }

                    // Check if this specific resource code block is found inside progress array history
                    const currentLevelIdStr = levels[matchingIndex].id.toString().trim();
                    isAlreadyCompleted = completedIds.includes(currentLevelIdStr);

                    // Setup fallback visibility states
                    const selector = document.getElementById('level-selector');
                    selector.innerHTML = levels.map((l, index) => `<option value="${index}">Scenario: ${l.title}</option>`).join('');
                    if (!targetLevelId) selector.classList.remove('hidden');

                    loadLevelByIndex(matchingIndex);
                } else {
                    document.getElementById('game-status-text').innerText = "Empty Playbook";
                }
            } catch (err) { 
                console.error("Connection matrix error:", err);
                document.getElementById('game-status-text').innerText = "Connection Failed";
            }
        }

        function loadSelectedLevelByIndex() {
            const index = parseInt(document.getElementById('level-selector').value);
            loadLevelByIndex(index);
        }

        function loadLevelByIndex(index) {
            if (index < 0 || index >= levels.length) return;
            
            activeLevelIndex = index;
            activeLevel = levels[activeLevelIndex];
            
            document.getElementById('level-selector').value = index;
            document.getElementById('victory-container').innerHTML = "";
            document.getElementById('level-title-display').innerText = `Scenario: ${activeLevel.title}`;

            const activeBg = activeLevel.background_url || "assets/bg.png";
            canvas.style.backgroundImage = `url('${activeBg}')`;
            
            elements = JSON.parse(JSON.stringify(activeLevel.objects)); 
            isLevelCleared = false;
            
            document.getElementById('game-status-text').innerText = "Find the Gap";
            document.getElementById('game-status-text').className = "text-xs font-bold uppercase tracking-wider text-slate-400";
            
            // Adjust visual star payout tag banners based on verification results
            const starStatus = document.getElementById('star-status-text');
            starStatus.classList.remove('hidden');
            if (isAlreadyCompleted) {
                starStatus.innerText = "✓ Cleared (0⭐)";
                starStatus.className = "text-[10px] font-bold uppercase tracking-widest text-slate-500";
            } else {
                starStatus.innerText = "⭐ Star Available";
                starStatus.className = "text-[10px] font-bold uppercase tracking-widest text-amber-400";
            }

            drawGameLayout();

            if (activeLevel.message && activeLevel.message.trim() !== "") {
                setTimeout(() => { alert(`Coach's Instructions:\n\n${activeLevel.message}`); }, 50);
            }
        }

        function drawGameLayout() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            elements.forEach(obj => {
                if (obj.name === 'correct') return;

                ctx.save();
                ctx.fillStyle = obj.isPlayer ? '#2563eb' : '#e2e8f0';
                if (obj.isPlayer) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#2563eb';
                }
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = obj.isPlayer ? '#ffffff' : '#0f172a';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(obj.name, obj.x, obj.y);
                ctx.restore();
            });
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            if (isLevelCleared) return;
            e.preventDefault();
            const pos = getCanvasCoordinates(e);
            activeDragElement = elements.find(obj => obj.isPlayer && Math.hypot(obj.x - pos.x, obj.y - pos.y) < 30);
            if (!activeDragElement) {
                activeDragElement = elements.find(obj => obj.name !== 'correct' && Math.hypot(obj.x - pos.x, obj.y - pos.y) < 30);
            }
        }

        window.addEventListener('mousemove', handleDrag);
        window.addEventListener('touchmove', handleDrag, { passive: false });

        function handleDrag(e) {
            if (!activeDragElement) return;
            e.preventDefault();
            const pos = getCanvasCoordinates(e);
            activeDragElement.x = Math.max(30, Math.min(pos.x, canvas.width - 30));
            activeDragElement.y = Math.max(30, Math.min(pos.y, canvas.height - 30));
            drawGameLayout();
            evaluateCollisionMatrix();
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
        function endDrag() { activeDragElement = null; }

        function evaluateCollisionMatrix() {
            const playerToken = elements.find(o => o.isPlayer);
            const targetToken = elements.find(o => o.name === 'correct');
            if (!playerToken || !targetToken || isLevelCleared) return;

            if (Math.hypot(playerToken.x - targetToken.x, playerToken.y - targetToken.y) < 45) {
                isLevelCleared = true;
                activeDragElement = null;
                submitCompletionToDatabase();
            }
        }

        // Fire transaction payload out to Apps Script endpoints 
        async function submitCompletionToDatabase() {
            sfxScore.play().catch(() => {});
            document.getElementById('game-status-text').innerText = "Processing Stars...";
            
            let payoutMessage = "Way to spot the option. You read the ice perfectly on that play!";
            
            if (activePlayerId && activeLevel) {
                try {
                    // Force activity mapping rules to register as "REPS" type
                    const postUrl = `${API_URL}?action=completeActivity&playerId=${activePlayerId}&activityType=REPS&activityId=${activeLevel.id}`;
                    const res = await fetch(postUrl, { method: 'POST' });
                    const payload = await res.json();
                    
                    if (!payload.success) {
                        // If duplication lock catches it, alter message box text array strings
                        payoutMessage = "Nice work! You cleared this level again. (Note: You already earned your training stars for this script scenario).";
                        isAlreadyCompleted = true;
                    } else {
                        isAlreadyCompleted = true;
                    }
                } catch (err) {
                    console.error("Failed to commit activity progression telemetry:", err);
                }
            }

            triggerSuccessCelebration(payoutMessage);
        }

        function triggerSuccessCelebration(customMessage) {
            document.getElementById('game-status-text').innerText = "✓ Level Cleared";
            document.getElementById('game-status-text').className = "text-xs font-bold uppercase tracking-wider text-emerald-400";
            
            // Adjust the status bar labels instantly
            const starStatus = document.getElementById('star-status-text');
            starStatus.innerText = "✓ Cleared (0⭐)";
            starStatus.className = "text-[10px] font-bold uppercase tracking-widest text-slate-500";

            const container = document.getElementById('victory-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4">
                    <div class="bg-slate-900 border-2 border-emerald-500/30 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl space-y-6 animate-victory">
                        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto border border-emerald-500/20 shadow-inner">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                            </svg>
                        </div>
                        <div>
                            <h2 class="text-2xl font-black tracking-tight text-white uppercase">Nice Play!</h2>
                            <p class="text-xs text-slate-400 mt-2 leading-relaxed">${customMessage}</p>
                        </div>
                        <div class="pt-2 flex flex-col gap-2">
                            <button onclick="advanceToNextScenario()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition-colors cursor-pointer uppercase text-xs tracking-wider">
                                Next Scenario ➔
                            </button>
                            <button onclick="closeModalOnly()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-400 font-bold py-2 rounded-xl transition-colors cursor-pointer uppercase text-[10px] tracking-wider">
                                Stay on Board
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModalOnly() {
            document.getElementById('victory-container').innerHTML = "";
        }

        function advanceToNextScenario() {
            // Reset state checks for sequential clicking maps
            isAlreadyCompleted = false; 
            let nextIndex = activeLevelIndex + 1;
            if (nextIndex >= levels.length) {
                nextIndex = 0;
            }
            
            // If explicit query tracking parameters are set, alter them in the URL window cleanly
            if (targetLevelId && levels[nextIndex]) {
                const newUrl = window.location.pathname + `?levelId=${levels[nextIndex].id}&playerId=${activePlayerId}`;
                window.history.pushState({ path: newUrl }, '', newUrl);
            }
            
            loadLevelByIndex(nextIndex);
        }
    </script>
</body>
</html>
