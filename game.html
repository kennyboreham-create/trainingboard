<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hockey Board</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b1329; touch-action: none; }
        canvas { 
            /* Forces the entire image to stretch precisely to the width and height of the canvas box */
            background-size: 100% 100%; 
            background-position: center; 
            background-repeat: no-repeat;
            touch-action: none; 
        }
        /* Custom animation for the victory popup window */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-victory {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex flex-col items-center p-4 select-none">

    <div class="max-w-4xl w-full flex justify-between items-center mb-2 shrink-0">
        <div>
            <h1 class="text-xl font-black uppercase text-white tracking-tight">Hockey Challenge Arena</h1>
            <select id="level-selector" onchange="loadSelectedLevelByIndex()" class="bg-slate-900 border border-slate-800 text-xs px-3 py-1.5 rounded-xl font-bold mt-1 text-slate-300 outline-none cursor-pointer"></select>
        </div>
        <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-center">
            <span id="game-status-text" class="text-xs font-bold uppercase tracking-wider text-slate-400">Loading Tactics...</span>
        </div>
    </div>

    <div class="relative w-full max-w-4xl bg-slate-950 rounded-2xl border-2 border-slate-800 shadow-2xl overflow-hidden aspect-[1000/600]">
        <canvas id="gameCanvas" width="1000" height="600" class="w-full h-full"></canvas>
    </div>

    <div id="victory-container"></div>

    <script>
        // PASTE YOUR COPIED PERMANENT WEB APP URL DIRECTLY BETWEEN THESE QUOTES:
        const API_URL = "https://script.google.com/macros/s/AKfycbwSuMSji4cLPqHii0UhYSqAr5d-cYGI7PDWI55RiCa9wP-F3tJ9nNONjzzAtnT2Ph2K/exec";
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let levels = [];
        let activeLevelIndex = 0;
        let activeLevel = null;
        let elements = [];
        let activeDragElement = null;
        let isLevelCleared = false;

        // Audio initialization bindings
        const sfxMusic = new Audio('assets/music.mp3'); sfxMusic.loop = true; sfxMusic.volume = 0.20;
        const sfxScore = new Audio('assets/scores.mp3');

        window.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', () => { 
                sfxMusic.play().catch(() => {}); 
            }, { once: true });
            initGameEngine();
        });

        // Pull level payload data safely from Google Sheet rows log index
        async function initGameEngine() {
            try {
                // Using redirect fallback optimization settings to clear stubborn browser configurations
                const response = await fetch(`${API_URL}?action=getLevels`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                const res = await response.json();
                
                if (res.success && res.levels && res.levels.length > 0) {
                    levels = res.levels;
                    
                    // Populate the dropdown menu
                    const selector = document.getElementById('level-selector');
                    selector.innerHTML = levels.map((l, index) => `<option value="${index}">Scenario: ${l.title}</option>`).join('');
                    
                    // --- DEEP LINKING PARSER ---
                    // 1. Parse query parameters from the website's address bar
                    const urlParams = new URLSearchParams(window.location.search);
                    const levelParam = urlParams.get('level'); // Looks for "?level=X"
                    
                    let targetIndex = 0; // Default fallback to Level 1 (Index 0)

                    if (levelParam !== null) {
                        // Convert text parameter string to an integer
                        const parsedLevelNum = parseInt(levelParam, 10);
                        
                        // Verify that it's a valid number and within our spreadsheet's level range
                        if (!isNaN(parsedLevelNum) && parsedLevelNum > 0 && parsedLevelNum <= levels.length) {
                            targetIndex = parsedLevelNum - 1; // Convert human scale (1, 2, 3) to array index (0, 1, 2)
                        }
                    }
                    
                    // 2. Boot up the requested scenario index layout
                    loadLevelByIndex(targetIndex);
                    // ---------------------------

                } else if (res.error) {
                    document.getElementById('game-status-text').innerText = "Database Error";
                    console.error("Backend Error Description:", res.error);
                } else {
                    document.getElementById('game-status-text').innerText = "Empty Playbook";
                }
            } catch (err) { 
                console.error("Connection matrix execution break:", err);
                document.getElementById('game-status-text').innerText = "Connection Failed";
            }
        }

        function loadSelectedLevelByIndex() {
            const index = parseInt(document.getElementById('level-selector').value);
            loadLevelByIndex(index);
        }

        function loadLevelByIndex(index) {
            // 1. Structural boundary check to prevent pulling empty arrays
            if (index < 0 || index >= levels.length) return;
            
            // 2. Cache the active level targets locally
            activeLevelIndex = index;
            activeLevel = levels[activeLevelIndex];
            
            // 3. Keep UI elements, dropdown menus, and overlays synced
            document.getElementById('level-selector').value = index;
            document.getElementById('victory-container').innerHTML = "";

            // 4. Extract saved map template and apply it to the canvas view canvas tracking layer
            const activeBg = activeLevel.background_url || "assets/bg.png";
            canvas.style.backgroundImage = `url('${activeBg}')`;
            
            // 5. Hard copy element list structures into active tracking loops
            elements = JSON.parse(JSON.stringify(activeLevel.objects)); 
            isLevelCleared = false;
            
            // 6. Reset status layout messaging states
            document.getElementById('game-status-text').innerText = "Find the Gap";
            document.getElementById('game-status-text').className = "text-xs font-bold uppercase tracking-wider text-slate-400";
            
            // 7. Paint active coordinate targets onto game board
            drawGameLayout();

            // 8. Coach Directions Alert: If custom tactical notes exist, push them to player viewport
            if (activeLevel.message && activeLevel.message.trim() !== "") {
                // Enclosed in a tiny 50ms timeout so the browser engine can finish updating 
                // canvas graphics elements on screen *before* the modal locks down interaction focus.
                setTimeout(() => {
                    alert(`Coach's Instructions:\n\n${activeLevel.message}`);
                }, 50);
            }
        }

        function drawGameLayout() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            elements.forEach(obj => {
                if (obj.name === 'correct') return; // Hidden from player blueprint matrix view

                ctx.save();
                ctx.fillStyle = obj.isPlayer ? '#2563eb' : '#e2e8f0';
                
                if (obj.isPlayer) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#2563eb';
                }
                
                ctx.beginPath();
                ctx.arc(obj.x, obj.y, 25, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = obj.isPlayer ? '#ffffff' : '#0f172a';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(obj.name, obj.x, obj.y);
                ctx.restore();
            });
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            if (isLevelCleared) return;
            e.preventDefault();
            const pos = getCanvasCoordinates(e);
            
            activeDragElement = elements.find(obj => obj.isPlayer && Math.hypot(obj.x - pos.x, obj.y - pos.y) < 30);
            if (!activeDragElement) {
                activeDragElement = elements.find(obj => obj.name !== 'correct' && Math.hypot(obj.x - pos.x, obj.y - pos.y) < 30);
            }
        }

        window.addEventListener('mousemove', handleDrag);
        window.addEventListener('touchmove', handleDrag, { passive: false });

        function handleDrag(e) {
            if (!activeDragElement) return;
            e.preventDefault();
            const pos = getCanvasCoordinates(e);
            
            activeDragElement.x = Math.max(30, Math.min(pos.x, canvas.width - 30));
            activeDragElement.y = Math.max(30, Math.min(pos.y, canvas.height - 30));
            
            drawGameLayout();
            evaluateCollisionMatrix();
        }

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function endDrag() { activeDragElement = null; }

        function evaluateCollisionMatrix() {
            const playerToken = elements.find(o => o.isPlayer);
            const targetToken = elements.find(o => o.name === 'correct');
            
            if (!playerToken || !targetToken || isLevelCleared) return;

            const distance = Math.hypot(playerToken.x - targetToken.x, playerToken.y - targetToken.y);
            
            if (distance < 45) {
                isLevelCleared = true;
                activeDragElement = null;
                triggerSuccessCelebration();
            }
        }

        function triggerSuccessCelebration() {
    sfxScore.play().catch(() => {});
    
    document.getElementById('game-status-text').innerText = "✓ Level Cleared";
    document.getElementById('game-status-text').className = "text-xs font-bold uppercase tracking-wider text-emerald-400";
    
    // --- NEW DYNAMIC LINK UPDATE START ---
    try {
        // 1. Grab the current URL query parameters
        const urlParams = new URLSearchParams(window.location.search);
        
        // 2. Fall back to your active code index + 1 if the URL didn't have a level parameter initially
        if (!urlParams.has('level')) {
            urlParams.set('level', (activeLevelIndex + 1).toString());
        }
        
        // 3. Append your "c" marker for completion/cleared status
        urlParams.set('status', 'c');
        
        // 4. Silently update the browser's address link without refreshing the game page
        const newUrl = `${window.location.pathname}?${urlParams.toString()}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
    } catch (err) {
        console.error("Failed to silently update browser link:", err);
    }
    // --- NEW DYNAMIC LINK UPDATE END ---
    
    const container = document.getElementById('victory-container');
    container.innerHTML = `
        <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4">
            <div class="bg-slate-900 border-2 border-emerald-500/30 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl space-y-6 animate-victory">
                <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto border border-emerald-500/20 shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <div>
                    <h2 class="text-2xl font-black tracking-tight text-white uppercase">Nice Play!</h2>
                    <p class="text-xs text-slate-400 mt-1">Way to spot the option. You read the ice perfectly on that play!</p>
                </div>
               
            </div>
        </div>
    `;
}

        function advanceToNextScenario() {
            let nextIndex = activeLevelIndex + 1;
            if (nextIndex >= levels.length) {
                nextIndex = 0;
            }
            loadLevelByIndex(nextIndex);
        }
    </script>
</body>
</html>
